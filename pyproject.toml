[project]
name = "tracerag"
version = "0.1.0"
description = "A RAG system using Milvus vector database for semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymilvus>=2.4.0",
    "requests>=2.31.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracerag*"]